{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Reservations</title>

    <link rel="stylesheet" href="{% static 'reservations/style.css' %}">

</head>
<body>

<main class="page-container">

    <div class="reservation-card">

        <h1>Choose Your Seat</h1>

        <p class="instructions">
            Enter your 4-character reservation code to get started.
        </p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="reservation_code">
                Reservation Code
            </label>

            <input
                type="text"
                id="reservation_code"
                name="reservation_code"
                minlength="4"
                maxlength="4"
                required
                autocomplete="off"
            >

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</main>

</body>
</html>
